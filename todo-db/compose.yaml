services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    # Explicit image name; it is not inferred from the folder or service name.
    image: todo-db-postgres:latest
    container_name: todo-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  todo-postgres-data:
    name: todo-postgres-data
